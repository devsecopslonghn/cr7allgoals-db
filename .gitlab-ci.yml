stages:
  - sql-review
  - release

variables:
  BYTEBASE_URL: "https://bytebase.apps.drgdevlab.com"
  BYTEBASE_PROJECT: "projects/cr7allgoals-db"
  BYTEBASE_FILE_PATTERN: "migrations/*.sql"
  BYTEBASE_ACTION_IMAGE: "bytebase/bytebase-action:latest"

sql-review:
  stage: sql-review
  image: $BYTEBASE_ACTION_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - migrations/*.sql
        - .bytebase/**
  script:
    - >-
      bytebase-action check
      --url "$BYTEBASE_URL"
      --service-account "$BYTEBASE_SERVICE_ACCOUNT"
      --service-account-secret "$BYTEBASE_SERVICE_ACCOUNT_SECRET"
      --file-pattern "$BYTEBASE_FILE_PATTERN"

create-release:
  stage: release
  image: $BYTEBASE_ACTION_IMAGE
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - migrations/*.sql
  script:
    - >-
      bytebase-action rollout
      --url "$BYTEBASE_URL"
      --service-account "$BYTEBASE_SERVICE_ACCOUNT"
      --service-account-secret "$BYTEBASE_SERVICE_ACCOUNT_SECRET"
      --project "$BYTEBASE_PROJECT"
      --file-pattern "$BYTEBASE_FILE_PATTERN"
      --targets "$BYTEBASE_TARGETS"

# BYTEBASE_SERVICE_ACCOUNT, BYTEBASE_SERVICE_ACCOUNT_SECRET and
# BYTEBASE_TARGETS are protected/masked GitLab CI variables. They are not
# committed and contain no Oracle credential. Keep production targets behind
# GitLab protected branch/environment approval and Bytebase rollout policy.
